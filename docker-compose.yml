# ============================================================
# docker-compose.yml - 天狼星（Tlias）学员管理系统生产部署
# 使用方式：
#   1. 修改下方环境变量或创建 .env 文件
#   2. docker compose up -d
#   3. 访问 http://服务器IP:8080
# ============================================================
version: "3.8"

services:
  # ---------- MySQL 数据库服务 ----------
  mysql:
    image: mysql:8.0
    container_name: tlias-mysql
    restart: always
    environment:
      # MySQL root 用户密码
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-000000}
      # 容器启动时自动创建的数据库名
      MYSQL_DATABASE: tlias
    ports:
      # 宿主机 3306 已被本地 MySQL 占用，改为映射 3307
      # 应用容器内部仍通过服务名 mysql:3306 连接，不受影响
      - "3307:3306"
    volumes:
      # 持久化 MySQL 数据到命名卷，防止容器删除后数据丢失
      - mysql-data:/var/lib/mysql
      # 首次启动时自动执行初始化 SQL（建表、初始化数据等）
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  # ---------- Spring Boot 应用服务 ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tlias-web-management:latest
    container_name: tlias-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      # 数据库连接信息（指向同文件内的 mysql 服务）
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-000000}
      # 文件上传存储路径
      UPLOAD_PATH: /data/uploads
    volumes:
      - upload-data:/data/uploads
    depends_on:
      - mysql

volumes:
  mysql-data:
  upload-data:
