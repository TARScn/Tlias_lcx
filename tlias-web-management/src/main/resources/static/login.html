<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Tlias智能学习辅助系统 - 登录</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h2>Tlias智能学习辅助系统</h2>
                <p>请登录您的账户</p>
            </div>
            <form class="login-form" id="loginForm" onsubmit="return false;">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" required autocomplete="current-password">
                </div>
                <div class="form-group" id="loginError" style="display:none;">
                    <p class="login-error-msg"></p>
                </div>
                <button type="submit" class="btn btn-primary btn-login" id="loginBtn" onclick="handleLogin()">登 录</button>
            </form>
        </div>
    </div>

    <script src="js/config.js?v=5"></script>
    <script src="js/utils.js?v=5"></script>

    <script>
        // 已登录则直接跳转主页
        var token = getToken();
        if (token) {
            window.location.href = 'index.html';
        }

        // 监听回车键提交
        document.getElementById('loginForm').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin();
            }
        });

        /**
         * 处理登录
         */
        function handleLogin() {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value.trim();
            var errorEl = document.getElementById('loginError');
            var errorMsg = errorEl.querySelector('.login-error-msg');

            // 清除之前的错误
            errorEl.style.display = 'none';
            errorMsg.textContent = '';

            // 基本校验
            if (!username) {
                errorMsg.textContent = '请输入用户名';
                errorEl.style.display = 'block';
                return;
            }
            if (!password) {
                errorMsg.textContent = '请输入密码';
                errorEl.style.display = 'block';
                return;
            }

            var btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '登录中...';

            fetch(BASE_URL + '/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, password: password })
            })
            .then(function(response) {
                if (!response.ok) throw new Error('网络请求失败: ' + response.status);
                return response.json();
            })
            .then(function(result) {
                if (result.code === 1 && result.data && result.data.token) {
                    // 登录成功，保存token和用户信息
                    saveToken(result.data.token);
                    saveUserInfo({
                        id: result.data.id,
                        username: result.data.username,
                        name: result.data.name
                    });
                    window.location.href = 'index.html';
                } else {
                    errorMsg.textContent = result.message || '用户名或密码错误';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = '登 录';
                }
            })
            .catch(function(err) {
                errorMsg.textContent = '网络错误，请检查服务器是否启动';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '登 录';
                console.error('登录失败:', err);
            });
        }
    </script>
</body>
</html>
