<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tlias智能学习辅助系统 - 部门管理</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 整体布局容器 -->
    <div class="container">
        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <div class="logo">
                <h2>Tlias智能学习辅助系统</h2>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="#" class="nav-item"><span class="icon">🏠</span> 首页</a></li>
                    <li>
                        <a href="#" class="nav-item has-submenu" onclick="toggleSubmenu(this)">
                            <span class="icon">👥</span> 班级学员管理
                            <span class="arrow">▶</span>
                        </a>
                        <ul class="submenu">
                            <li><a href="#">班级管理</a></li>
                            <li><a href="#">学员管理</a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#" class="nav-item has-submenu active" onclick="toggleSubmenu(this)">
                            <span class="icon">⚙️</span> 系统信息管理
                            <span class="arrow">▼</span>
                        </a>
                        <ul class="submenu" style="display: block;">
                            <li><a href="#" class="active">部门管理</a></li>
                            <li><a href="#">员工管理</a></li>
                        </ul>
                    </li>
                    <li>
                        <a href="#" class="nav-item has-submenu" onclick="toggleSubmenu(this)">
                            <span class="icon">📊</span> 数据统计管理
                            <span class="arrow">▶</span>
                        </a>
                        <ul class="submenu">
                            <li><a href="#">统计报表</a></li>
                            <li><a href="#">数据分析</a></li>
                        </ul>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- 右侧主内容区 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="topbar">
                <div class="page-title">
                    <h3>部门管理</h3>
                </div>
                <div class="user-info">
                    <button class="btn btn-primary" onclick="openAddModal()">+ 新增部门</button>
                    <div class="user-profile">
                        <span class="user-avatar">👤</span>
                        <span class="user-name">宋江</span>
                        <button class="btn-logout" onclick="logout()">退出登录</button>
                    </div>
                </div>
            </header>

            <!-- 表格区域 -->
            <section class="table-section">
                <div class="table-header">
                    <h4>部门列表</h4>
                </div>
                <table class="dept-table">
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>部门名称</th>
                            <th>最后修改时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="deptTableBody">
                        <!-- 数据由 JavaScript 动态渲染 -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- 新增/修改部门弹窗 -->
    <div id="deptModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">新增部门</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="deptForm">
                    <input type="hidden" id="deptId">
                    <div class="form-group">
                        <label for="deptName">部门名称</label>
                        <input type="text" id="deptName" placeholder="请输入部门名称" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="submitDept()">确定</button>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div id="deleteModal" class="modal">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h3>确认删除</h3>
                <span class="close" onclick="closeDeleteModal()">&times;</span>
            </div>
            <div class="modal-body">
                <p>确定要删除部门「<span id="deleteDeptName"></span>」吗？此操作不可撤销。</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" onclick="closeDeleteModal()">取消</button>
                <button class="btn btn-danger" onclick="confirmDelete()">确定删除</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
</body>
</html>
